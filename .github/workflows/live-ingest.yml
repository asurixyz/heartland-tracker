name: Live ingest

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull GDELT + RSS
        run: node ingest/pull-live.mjs
      - name: Commit live snapshot
        run: |
          git config user.name "heartland-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live/events.json
          git diff --staged --quiet || git commit -m "chore: refresh live news snapshot"
          git push
